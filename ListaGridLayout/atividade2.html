<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;

            display: grid;

            grid-template-columns: 25% 75%;
            grid-template-rows: 18% 64% 18%;

            grid-template-areas:
                "header header"
                "nav content"
                "nav footer";
        }

        .header {
            grid-area: header;
            background-color: #e82d7b;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .nav {
            grid-area: nav;
            background-color: #c2bf87;
            border-left: 1px solid black;
            border-right: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .content {
            grid-area: content;
            background-color: #e7ad7e;
            border-right: 1px solid black;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
        }

        .titulo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .conteudo-principal {
            display: flex;
            width: 100%;
            gap: 20px;
        }

        .imagem {
            width: 250px;
            height: 220px;
            border: 3px solid black;
            flex-shrink: 0;
        }

        .linhas {
            flex: 1;
        }

        .linha {
            width: 100%;
            height: 3px;
            background-color: black;
            margin-bottom: 8px;
        }

        .linhas-baixo {
            width: 100%;
            margin-top: 10px;
        }

        .footer {
            grid-area: footer;
            background-color: #76a99c;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        @media (max-width: 600px) {

            .container {
                width: 100vw;
                height: 100vh;

                display: grid;

                grid-template-columns: 1fr;

                grid-template-rows:
                    15% 15% 55% 15%;

                grid-template-areas:
                    "header"
                    "nav"
                    "content"
                    "footer";
            }

            .header,
            .nav,
            .footer {
                font-size: 24px;
            }

            .content {
                padding: 20px;
            }

            .titulo {
                font-size: 26px;
            }

            .conteudo-principal {
                flex-direction: column;
            }

            .imagem {
                width: 100%;
                height: 120px;
            }

            .linhas {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            Header
        </header>

        <nav class="nav">
            Nav
        </nav>

        <main class="content">

            <div class="titulo">
                Content
            </div>

            <div class="conteudo-principal">

                <div class="imagem"></div>

                <div class="linhas">
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                    <div class="linha"></div>
                </div>

            </div>

            <div class="linhas-baixo">
                <div class="linha"></div>
                <div class="linha"></div>
                <div class="linha"></div>
                <div class="linha"></div>
            </div>

        </main>

        <footer class="footer">
            Footer
        </footer>

    </div>

</body>

</html>
