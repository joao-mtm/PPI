<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4a</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        .box {
            display: block;
            min-height: 80px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            font-weight: bold;
        }

        .box1 {
            background-color: blueviolet;
        }

        .box2 {
            background-color: green;
        }

        .box3 {
            background-color: red;
        }

        .box4 {
            background-color: yellow;
            color: black;
        }
    </style>
</head>

<body>
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>

    <div class="explicacao">
        <p>Essas box ficam assim por padrão pois, <code>&lt;div&gt;</code> têm a propriedade
            <code>display: block</code>.
            Ele faz com que ocupe uma linha inteira, ficando uma abaixo da outra.
            Fazendo com que as caixas fiquem empilhadas verticalmente uma abaixo da outra.</p>
    </div>
</body>

</html>
