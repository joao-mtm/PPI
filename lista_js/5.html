<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sorteio de Números</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <h1>Sorteio de Números</h1>

    <label for="minimo">Mínimo</label>
    <input type="number" id="minimo" value="1">

    <label for="maximo">Máximo</label>
    <input type="number" id="maximo" value="100">

    <button id="btnSortear">Sortear</button>

    <p id="resultado"></p>

    <h2>Números sorteados</h2>
    <ul id="listaSorteados"></ul>

    <script>
        // cada item guarda o numero e quantas vezes ele saiu
        const sorteados = [];

        function sortear() {
            let min = parseInt(document.getElementById("minimo").value);
            let max = parseInt(document.getElementById("maximo").value);

            // se nao preencher, usa de 1 a 100
            if (isNaN(min)) {
                min = 1;
            }
            if (isNaN(max)) {
                max = 100;
            }
            const numero = Math.floor(Math.random() * (max - min + 1)) + min;

            // procura se o numero ja foi sorteado
            let encontrado = null;
            for (const item of sorteados) {
                if (item.numero === numero) {
                    encontrado = item;
                }
            }

            if (encontrado === null) {
                sorteados.push({ numero: numero, vezes: 1 });
            } else {
                encontrado.vezes++;
            }

            document.getElementById("resultado").innerText = `Número sorteado: ${numero} (entre ${min} e ${max})`;
            mostrarLista();
        }

        function mostrarLista() {
            const ul = document.getElementById("listaSorteados");
            ul.innerHTML = "";

            for (const item of sorteados) {
                const li = document.createElement("li");
                if (item.vezes > 1) {
                    li.innerText = `${item.numero} (sorteado ${item.vezes} vezes)`;
                } else {
                    li.innerText = `${item.numero}`;
                }
                ul.appendChild(li);
            }
        }

        document.getElementById("btnSortear").addEventListener("click", sortear);
    </script>
</body>
</html>
