<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 3</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #a0a0a0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            width: 320px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        .usuario {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .usuario:last-child {
            border-bottom: none;
        }

        .foto {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .info h4 {
            margin: 0;
            color: #444;
            font-size: 15px;
        }

        .info p {
            margin: 3px 0 0 0;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/64.jpg" alt="Bernabei" class="foto">
            <div class="info">
                <h4>Bernabei</h4>
                <p>Beira-Rio, Porto Alegre</p>
            </div>
        </div>

        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/10.jpg" alt="Alerrandro" class="foto">
            <div class="info">
                <h4>Alerrandro</h4>
                <p>Beira-Rio, Porto Alegre</p>
            </div>
        </div>

        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/95.jpg" alt="Alan Patrick" class="foto">
            <div class="info">
                <h4>Alan Patrick</h4>
                <p>Beira-Rio, Porto Alegre</p>
            </div>
        </div>

        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/28.jpg" alt="Gabriel Mercado" class="foto">
            <div class="info">
                <h4>Gabriel Mercado</h4>
                <p>Beira-Rio, Porto Alegre</p>
            </div>
        </div>

    </div>

</body>
</html>
