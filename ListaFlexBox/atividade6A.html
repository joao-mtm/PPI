<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 6A</title>
    <style>
    * {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
}

.container {
    width: 100vw;
    height: 100vh;

    display: grid;

    grid-template-columns: 2fr 2fr 2fr 2fr 1fr 0.6fr;
    grid-template-rows: 1fr 1fr 1fr;

    gap: 5px;

    background-color: white;
}

/* Laranja */
.laranja {
    background-color: #ff9d1c;
    grid-column: 1 / 3;
    grid-row: 1;
}

/* Azul */
.azul {
    background-color: #b5c8e1;
    grid-column: 1 / 3;
    grid-row: 2;
}

/* Rosa */
.rosa {
    background-color: #f3b19f;
    grid-column: 3 / 5;
    grid-row: 1 / 3;
}

/* Amarelo */
.amarelo {
    background-color: #f5b329;
    grid-column: 1 / 5;
    grid-row: 3;
}

/* Azul claro */
.azul-claro {
    background-color: #c7dddd;
    grid-column: 5 / 7;
    grid-row: 1;
}

/* Verde */
.verde {
    background-color: #b7ca6c;
    grid-column: 5;
    grid-row: 2 / 4;
}

/* Bolinhas */
.bolinhas {
    grid-column: 6;
    grid-row: 2 / 4;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.bolinha {
    width: 100px;
    height: 100px;
    border-radius: 100%;
}

.laranja-bolinha {
    background-color: #ed9068;
}

.rosa-bolinha {
    background-color: #d4aaaa;
}

.verde-bolinha {
    background-color: #c2ca9d;
}

.roxa-bolinha {
    background-color: #cbbce3;
}

@media (max-width: 600px) {

    .container {
        width: 100%;
        min-height: 100vh;

        display: flex;
        flex-direction: column;

        gap: 5px;
    }
    .laranja,
    .azul,
    .rosa,
    .amarelo,
    .azul-claro,
    .verde {
        width: 100%;
        height: 150px;
        grid-column: auto;
        grid-row: auto;
    }
    .bolinhas {
        width: 100%;
        height: auto;

        display: flex;
        flex-direction: row;

        justify-content: center;
        align-items: center;

        gap: 15px;

        padding: 15px;
    }

    .bolinha {
        width: 35px;
        height: 35px;
    }
}
</style>

</head>

<body>

    <div class="container">

        <div class="laranja"></div>
        <div class="azul"></div>
        <div class="rosa"></div>
        <div class="amarelo"></div>

        <div class="verde"></div>
        <div class="azul-claro"></div>

        <div class="bolinhas">
            <div class="bolinha laranja-bolinha"></div>
            <div class="bolinha rosa-bolinha"></div>
            <div class="bolinha verde-bolinha"></div>
            <div class="bolinha roxa-bolinha"></div>
        </div>

    </div>

</body>
</html>
